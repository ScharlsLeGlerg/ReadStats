name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo signs release builds with the developer's private key
      # (android/key.properties, not in the repo). Fall back to the debug
      # key so the release build works for personal use.
      - name: Use debug signing for release
        run: |
          sed -i 's/signingConfig = signingConfigs.release/signingConfig = signingConfigs.debug/' android/app/build.gradle

      - run: flutter pub get

      - name: Build release APKs (one per CPU type)
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: readstats-apk
          path: build/app/outputs/flutter-apk/*.apk
